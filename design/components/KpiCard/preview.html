<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>KpiCard — HireLens</title></head>
<body class="hl">
<div class="hl-pad"><div class="hl-grid-3">
<div class="hl-card hl-kpi"><div class="hl-kpi__top"><span>Open jobs</span><span class="hl-kpi__icon"><i data-icon="briefcase"></i></span></div><span class="hl-kpi__val" data-count="3">0</span><span class="hl-kpi__foot">1 closing this week</span></div>

<div class="hl-card hl-kpi"><div class="hl-kpi__top"><span>Average score</span><span class="hl-kpi__icon"><i data-icon="sparkles"></i></span></div><span class="hl-kpi__val" data-count="66">0</span><span class="hl-kpi__foot">Junior Web Developer</span></div>
<div class="hl-card hl-kpi"><div class="hl-kpi__top"><span>Time to hire</span><span class="hl-kpi__icon"><i data-icon="clock"></i></span></div><span class="hl-kpi__val"><span data-count="12">0</span><span style="font-size:17px;font-weight:700;color:var(--ink-muted)"> days</span></span><span class="hl-kpi__foot">Average, last 90 days</span></div>
</div></div>
